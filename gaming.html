<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jumia Gaming - Pure HTML CSS</title>
<style>
  body{ background:#f5f5f5;
     font: 100;}

  .top-bar{
    background:#ff9900;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 15px;
    font-weight:bold;
  }
  .top-bar a{
    background:black;
    color:white;
    text-decoration:none;
    padding:6px 12px;
    font-size:12px;
  }
  .header{
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
  }
  .left, .right{
    display:flex;
    align-items:center;
    gap:15px;
  }
  .logo{ font-weight:900; font-size:26px; }
  .logo span{ color:#f68b1e; }
  .menu, .right span{ font-size:24px; cursor:pointer; }

 
  .search-wrap{ background:white; padding:0 15px 15px 15px; }
  .banner img{
    width:100%;
    border-radius:8px;
  }

  
  .section{ background:white; margin-top:8px; padding:15px; }
  .section h2{ font-size:18px; margin-bottom:12px; }

 
  .products-row{
    display:flex;
    gap:12px;
    overflow-x:auto;
  }
  
  .product{
    flex:0 0 160px; 
  }
  .img-area{ position:relative;
     background:#fff; 
    }

  .img-area img{
    width:100%;
    height:140px ;
    border-radius:6px;
  }
  .off{
    position:absolute;
    top:5px; right:5px;
    background:#fef3e2;
    color:#f68b1e;
    font-weight:bold;
    padding:2px 6px;
    border-radius:4px;
    font-size:13px;
  }
  .name{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:6px;
  }
  </style>
  
</head>
<body>

  <div class="top-bar">
    <span>KSH Cash on Delivery</span>
    <a href="#">SHOP NOW</a>
  </div>

  <header class="header">
    <div class="left">
      <span class="menu">-</span>
      <span class="logo">JUMIA<span>*</span></span>
    </div>
    
  </header>

  <div class="search-wrap">
      <span>search</span>
      <input type="text" placeholder="Gaming">
    </div>
  </div>

  <div class="breadcrumb">Home > Gaming</div>

  <div class="banner">
    <img src="images/images (2).jpg" alt="Gaming deals Save up to 40% off">
  </div>

  <section class="section">
    <h2>Top Sellers</h2>
    <div class="products-row">
      <div class="product">
        <div class="img-area">
          <span class="off">-57%</span>
          <img src="images/images (2).jpg" alt="console"/>
          <p class="name">handheld retro game console</p>
        <p class="price">KSh 643</p>
      </div>
      <div class="product">
        <div class="img-area">
          <span class="off">-50%</span>
          <img src="#" alt="#"/>
        </div>
        <img src=""
        <p class="name">2pcs Wireless Gamepa...</p>
        <p class="price">KSh 1,359</p>
      </div>
      
       
    </div>
  </section>

 

</body>
</html>
